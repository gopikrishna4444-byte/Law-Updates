<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Law Updates</title>
<meta name="description" content="Latest Income Tax, GST and Companies Act notifications and circulars from official sources.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="mark" aria-hidden="true">§</span>
      <div>
        <h1>Law Updates</h1>
        <p class="sub" id="checked">Loading…</p>
      </div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search number, section, subject…" autocomplete="off">
  </label>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter"></div>
</header>

<main id="main">
  <section id="feed" aria-live="polite"></section>
  <section id="library" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="Laws">
  <button data-tab="all" class="on"><span class="dot all"></span>All<b class="badge" data-badge="all"></b></button>
  <button data-tab="income-tax"><span class="dot it"></span>Income Tax<b class="badge" data-badge="income-tax"></b></button>
  <button data-tab="gst"><span class="dot gst"></span>GST<b class="badge" data-badge="gst"></b></button>
  <button data-tab="companies"><span class="dot co"></span>Companies<b class="badge" data-badge="companies"></b></button>
  <button data-tab="library"><span class="dot lib"></span>Acts</button>
</nav>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
